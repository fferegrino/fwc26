<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A tiny app to visualize your sticker collection and make it easy to exchange with others to complete our collection faster!"
    />
    <title>Panini FWC26 — My Stickers</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Panini FWC26 — My Stickers" />
    <meta
      property="og:description"
      content="A tiny app to visualize your sticker collection and make it easy to exchange with others to complete our collection faster!"
    />
    <meta
      property="og:image"
      content="https://ik.imagekit.io/thatcsharpguy/fwc26/my_stickers.png"
    />
    <meta property="og:image:alt" content="My stickers — Panini FIFA World Cup 2026" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Panini FWC26 — My Stickers" />
    <meta
      name="twitter:description"
      content="A tiny app to visualize your sticker collection and make it easy to exchange with others to complete our collection faster!"
    />
    <meta
      name="twitter:image"
      content="https://ik.imagekit.io/thatcsharpguy/fwc26/my_stickers.png"
    />

    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>
        My Panini FWC26 Collection
        <span id="global-counter" class="global-counter"></span>
      </h1>
      <div class="controls">
        <label for="sticker-search">Search</label>
        <input
          type="search"
          id="sticker-search"
          placeholder="Code or name…"
          autocomplete="off"
          spellcheck="false"
        />
        <label for="country-filter">Country</label>
        <select id="country-filter">
          <option value="__all__">All countries</option>
        </select>
        <label for="status-filter">Show</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="missing">Missing</option>
          <option value="owned">Owned</option>
          <option value="dupes">Duplicates only</option>
        </select>
        <label class="toggle">
          <input type="checkbox" id="group-by-country" checked />
          Group by country
        </label>
        <label class="toggle">
          <input type="checkbox" id="compact-toggle" />
          Compact
        </label>
      </div>
    </header>

    <main id="gallery"></main>

    <footer class="site-footer">
      <p>
        Images from
        <a href="https://www.laststicker.com/" target="_blank" rel="noopener noreferrer">laststicker.com</a>.
        I do not own the rights to these images.
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
